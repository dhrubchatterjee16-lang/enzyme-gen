[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enzyme-gen"
version = "1.0.0"
description = "ProteinGym Benchmark Suite & ESM-2 Zero-Shot Mutational Fitness Engine"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Dhrub Chatterjee", email = "dhrubchatterjee16@gmail.com"}
]
keywords = [
    "proteingym",
    "esm2",
    "deep-mutational-scanning",
    "protein-engineering",
    "directed-evolution",
    "enzymes"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics"
]
dependencies = [
    "pydantic>=2.0.0",
    "numpy>=1.22.0",
    "scipy>=1.9.0"
]

[project.optional-dependencies]
api = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0"
]
test = [
    "pytest>=7.0.0"
]

[project.scripts]
enzyme-gen = "enzyme_gen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
